<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Inquiry</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f7fa;
}

.container{
    width:90%;
    max-width:1100px;
    margin:50px auto;
    display:flex;
    background:#fff;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.contact-info{
    width:35%;
    background:#0d6efd;
    color:#fff;
    padding:40px;
}

.contact-info h2{
    margin-bottom:20px;
}

.contact-info p{
    margin-bottom:15px;
    line-height:1.6;
}

.contact-form{
    width:65%;
    padding:40px;
}

.contact-form h2{
    margin-bottom:25px;
    color:#333;
}

.row{
    display:flex;
    gap:20px;
}

.input-group{
    width:100%;
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#555;
}

.input-group input,
.input-group select,
.input-group textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    outline:none;
    font-size:15px;
}

.input-group textarea{
    resize:vertical;
    min-height:140px;
}

.checkbox{
    margin-bottom:20px;
}

.checkbox input{
    margin-right:8px;
}

button{
    background:#0d6efd;
    color:#fff;
    border:none;
    padding:14px 30px;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#0b5ed7;
}

@media(max-width:768px){

.container{
    flex-direction:column;
}

.contact-info,
.contact-form{
    width:100%;
}

.row{
    flex-direction:column;
    gap:0;
}

}
</style>

</head>
<body>

<div class="container">

    <div class="contact-info">
        <h2>Contact Information</h2>

        <p><strong>Email</strong><br>
        sales@yourcompany.com</p>

        <p><strong>Phone</strong><br>
        +91 98765 43210</p>

        <p><strong>Business Hours</strong><br>
        Monday - Friday<br>
        9:00 AM - 6:00 PM</p>

        <p><strong>Address</strong><br>
        Your Company Name<br>
        123 Business Street<br>
        New Delhi, India</p>
    </div>

    <div class="contact-form">

        <h2>Product Inquiry</h2>

        <form>

            <div class="row">

                <div class="input-group">
                    <label>Full Name *</label>
                    <input type="text" placeholder="Enter your name" required>
                </div>

                <div class="input-group">
                    <label>Company Name</label>
                    <input type="text" placeholder="Company Name">
                </div>

            </div>

            <div class="row">

                <div class="input-group">
                    <label>Email *</label>
                    <input type="email" placeholder="Enter email" required>
                </div>

                <div class="input-group">
                    <label>Phone</label>
                    <input type="tel" placeholder="Phone Number">
                </div>

            </div>

            <div class="row">

                <div class="input-group">
                    <label>Product *</label>
                    <select required>
                        <option value="">Select Product</option>
                        <option>Product 1</option>
                        <option>Product 2</option>
                        <option>Product 3</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Quantity</label>
                    <input type="number" placeholder="Required Quantity">
                </div>

            </div>

            <div class="input-group">
                <label>Subject *</label>
                <input type="text" placeholder="Subject" required>
            </div>

            <div class="input-group">
                <label>Message *</label>
                <textarea placeholder="Write your inquiry here..." required></textarea>
            </div>

            <div class="checkbox">
                <label>
                    <input type="checkbox" required>
                    I agree to be contacted regarding my inquiry.
                </label>
            </div>

            <button type="submit">Submit Inquiry</button>

        </form>

    </div>

</div>

</body>
</html>
